<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contener">
        <nav class="nav">
            <h1 id="header">Unit Converter</h1>
        </nav>

        <div class="main-contener">
            <div class="box box-contener1">
                <input type="number" placeholder="0" id="inp1">
                <select name="unit" id="unit-selecter1" class="units">
                    <option value="millimeter" selected>Millimeter</option>
                    <option value="centimeter">Centimeter</option>
                    <option value="decimeter">Decimeter</option>
                    <option value="meter">Meter</option>
                    <option value="kilometer">Kilometer</option>
                    <option value="foot">Foot</option>
                    <option value="inch">Inch</option>
                    <option value="mile">Mile</option>
                    <option value="yard">Yard</option>
                </select>
            </div>

            <div class="box eql-sign"><span>=</span></div>

            <div class="box box-contener2">
                <input type="number" placeholder="0" id="inp2" >
                <select name="unit" id="unit-selecter2" class="units">
                    <option value="millimeter" selected>Millimeter</option>
                    <option value="centimeter">Centimeter</option>
                    <option value="decimeter">Decimeter</option>
                    <option value="meter">Meter</option>
                    <option value="kilometer">Kilometer</option>
                    <option value="foot">Foot</option>
                    <option value="inch">Inch</option>
                    <option value="mile">Mile</option>
                    <option value="yard">Yard</option>
                </select>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
