<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contener">
        <nav class="nav">
            <h1 id="header">Unit Converter</h1>
        </nav>
        <div class="head">
            <div class="feet_contener">
                <label for="feet">Feet</label>
                <input type="number" name="feet" placeholder="1 Foot" id="feet">
            </div>
            <div><h1>=</h1></div>
            <div class="inch_contener">
                <label for="inch">Inch</label>
                <input type="number" name="inch" placeholder="12 Inch" id="inch" value="">
            </div>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
